<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title id="titulo-aba">missão aura</title>
  <link rel="stylesheet" href="style.css">
  <script src="sketch.js"></script>
</head>
<body>
  <main>
    <h1 id="titulo-principal">Missão Aura!</h1>

  <form>
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
    <label for="data de nascimemto">data de nascimento:</label>
    <input type="date" id="nascimento" name="nascimento" required>
  <label for="pergunta">Você é aventureiro e gosta de resolver as coisas com agilidade?</label>
  <select id="resposta" name="missão">
    <option value="1">Sim</option>
    <option value="2">Não</option>
    <option value="3">Talvez</option>
    <option value="4">Nem tanto</option>
  </select>
    <label for="pergunta">Você gosta de desvendar mistérios e visitar lugares novos em missões ?</label>
  <select id="resposta missão" name="missão">
    <option value="1">Sim</option>
    <option value="2">Não</option>
    <option value="3">Talvez</option>
    <option value="4">As vezes</option>
  </select>
    <label for="pergunta">Você sempre esta atento com as coisas ao seu redor quando esta agindo na missão?</label>
  <select id="missão" name="missão">
    <option value="1">Sim</option>
    <option value="2">De vez em quando</option>
    <option value="3">As vezes</option>
    <option value="4">Não</option>
  </select>
    <label for="pergunta">Você é atento e paciente com os comandos que tem que seguir na missão?</label>
  <select id="missão aura" name="missão">
    <option value="1">Sim</option>
    <option value="2">Nem um pouco</option>
    <option value="3">As vezes</option>
    <option value="4">Depende</option>
  </select>
    <button id="btn-enviar">Descobrir Missão</button>
  </form>
    </main>
  
  </body>
</html>
